  <script>

      {id:"start",group:"Start",code:"00",en:"Course overview",zh:"课程概览",kind:"cover"},
      {id:"language",group:"Chapter 3 · Introduction to Algebra",code:"3.1",en:"Letters & algebraic language",zh:"字母与代数语言",
        intro:"Letters can stand for unknown or changing numbers. An algebraic expression records a mathematical relationship without an equals sign.",
        introZh:"字母可以表示未知数或变化的数。代数式不用等号，而是记录数量之间的运算关系。",
        concepts:[
          ["Unknown values","A letter such as <span class='math'>x</span> may represent a number we do not yet know.","字母（如 x）可以表示尚未知道的数。"],
          ["Translate carefully","“7 less than x” means <span class='math'>x − 7</span>; the order of the words matters.","“比 x 少 7”写成 x−7；要留意文字中的先后关系。"],
          ["Expression ≠ equation","<span class='math'>3a + 2</span> is an expression. <span class='math'>3a + 2 = 11</span> is an equation.","3a+2 是代数式；3a+2=11 是方程。"]],
        example:{title:"From words to symbols",text:"Write “three times the sum of n and 4” as an algebraic expression.",steps:["The sum of n and 4 is <span class='math'>n + 4</span>.","Three times that whole sum is <span class='math'>3(n + 4)</span>.","Brackets show that multiplication applies to the complete sum."],zh:"把“n 与 4 的和的 3 倍”写成代数式。"},
        questions:[
          q("l1q1","Which expression means “8 less than p”?","哪个代数式表示“比 p 少 8”？",["8 − p","p − 8","8p","p ÷ 8"],"p − 8"),
          q("l1q2","Which expression means “five times the sum of x and 2”?","哪个代数式表示“x 与 2 的和的 5 倍”？",["5x + 2","5(x + 2)","x + 10","5x × 2"],"5(x + 2)"),
          q("l1q3","Which item is an equation?","下列哪一项是方程？",["4m − 1","2a + 3b","5x + 2 = 17","7y"],"5x + 2 = 17")
        ]},
      {id:"notation",group:"Chapter 3 · Introduction to Algebra",code:"3.1",en:"Notation & simplifying",zh:"代数记号与化简",
        intro:"Algebra shortens repeated operations. Multiplication signs are usually omitted, powers use indices, and only like terms can be combined.",
        introZh:"代数记号可以简化重复运算：乘号通常省略，重复相乘用指数表示，只有同类项才能合并。",

    function q(id,en,zh,options,answer){return {id,en,zh,options,answer}}
    function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
    let state={answers:{},completed:[],active:"start",showZh:false};
    try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(saved&&typeof saved==="object") state={...state,...saved,answers:saved.answers||{},completed:saved.completed||[]}}catch(e){}
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
    function lessonQuestions(l){return l.questions||[]}
    const assessable=lessons.filter(l=>lessonQuestions(l).length);
    function findLesson(id){return lessons.find(l=>l.id===id)||lessons[0]}
    function questionScore(l){const qs=lessonQuestions(l);let answered=0,correct=0;qs.forEach(q=>{if(Object.prototype.hasOwnProperty.call(state.answers,q.id)){answered++;if(state.answers[q.id]===q.answer)correct++}});return{answered,correct,total:qs.length}}
    function renderNav(){
      const nav=document.getElementById("lessonNav");let current="";
      nav.innerHTML=lessons.map((l,i)=>{
        const group=l.group!==current?(current=l.group,`<div class="navGroupTitle">${esc(l.group)}</div>`):"";
        const done=state.completed.includes(l.id)?" done":"";const active=state.active===l.id?" active":"";
        return `${group}<button class="navBtn${done}${active}" data-go="${l.id}"><span class="navNum">${state.completed.includes(l.id)?"✓":esc(l.code)}</span><span><span class="navName">${esc(l.en)}</span><span class="navZh">${esc(l.zh)}</span></span></button>`;
      }).join("");
      const count=assessable.filter(l=>state.completed.includes(l.id)).length;
      document.getElementById("progressText").textContent=`${count} / ${assessable.length}`;
      document.getElementById("progressFill").style.width=`${assessable.length?count/assessable.length*100:0}%`;
    }
    function renderConcepts(l){return `<section class="concepts">${l.concepts.map((c,i)=>`<article class="card"><div class="cardLabel">Concept ${i+1}</div><h3>${c[0]}</h3><p>${c[1]}</p><p class="zhText">${c[2]}</p></article>`).join("")}</section>`}
    function renderExample(ex){return `<section class="example"><div class="eyebrow">Worked example · 例题</div><div class="exampleGrid"><div><h3>${ex.title}</h3><p>${ex.text}</p><p class="zhText">${ex.zh}</p></div><ol class="steps">${ex.steps.map((s,i)=>`<li data-step="${i+1}">${s}</li>`).join("")}</ol></div></section>`}
    function renderLab(type){
      if(type==="formula") return `<section class="lab"><div class="eyebrow">Interactive lab · 公式实验</div><h3>Substitution machine</h3><p>Choose a formula and change its measurements.</p><div class="labControls">
        <div class="control"><label for="formulaChoice">Formula · 公式</label><select id="formulaChoice"><option value="rect">P = 2(l + w)</option><option value="tri">A = ½bh</option><option value="volume">V = lwh</option></select></div>
        <div class="control"><label for="valueA" id="labelA">l</label><input id="valueA" type="number" value="8" step="1"></div>
        <div class="control"><label for="valueB" id="labelB">w</label><input id="valueB" type="number" value="5" step="1"></div>
        <div class="control" id="valueCWrap"><label for="valueC" id="labelC">h (used for volume)</label><input id="valueC" type="number" value="2" step="1"></div></div><div class="labResult" id="labResult">P = 2(8 + 5) = 26</div></section>`;
      if(type==="sequence") return `<section class="lab"><div class="eyebrow">Interactive lab · 数列实验</div><h3>Build a linear sequence</h3><p>Set the first term and common difference; compare the list with its general term.</p><div class="labControls">
        <div class="control"><label for="seqFirst">First term · 首项</label><input id="seqFirst" type="number" value="5"></div>
        <div class="control"><label for="seqDiff">Common difference · 公差</label><input id="seqDiff" type="number" value="3"></div>
        <div class="control"><label for="seqN">Position n · 项数 n</label><input id="seqN" type="number" value="20" min="1" max="100"></div></div><div class="labResult" id="labResult">5, 8, 11, 14, 17, 20 · Tₙ = 3n + 2 · T₂₀ = 62</div></section>`;
      if(type==="equation") return `<section class="lab"><div class="eyebrow">Interactive lab · 方程实验</div><h3>Balance both sides</h3><p>Explore equations of the form ax + b = cx + d.</p><div class="labControls">
        <div class="control"><label for="eqA">a</label><input id="eqA" type="number" value="5"></div>
        <div class="control"><label for="eqB">b</label><input id="eqB" type="number" value="4"></div>
        <div class="control"><label for="eqC">c</label><input id="eqC" type="number" value="2"></div>
        <div class="control"><label for="eqD">d</label><input id="eqD" type="number" value="19"></div></div><div class="labResult" id="labResult">5x + 4 = 2x + 19 → 3x = 15 → x = 5</div></section>`;
      return "";
    }
    function renderQuestion(item,index){
      const chosen=state.answers[item.id];
      return `<article class="q"><div class="qNo">QUESTION ${index+1}</div><h4>${esc(item.en)}</h4><p class="zhText">${esc(item.zh)}</p><div class="options">${item.options.map((o,oi)=>{
        let cls="option";if(chosen!==undefined){if(o===item.answer)cls+=" correct";else if(o===chosen)cls+=" wrong"}return `<button class="${cls}" data-qid="${item.id}" data-opt="${oi}">${esc(o)}</button>`}).join("")}</div>
        <div class="feedback ${chosen===undefined?"":chosen===item.answer?"ok":"no"}">${chosen===undefined?"":chosen===item.answer?"Correct · 正确":"Not yet — compare the rule above. · 再想一想"}</div></article>`;
    }
    function renderQuiz(l){
      const s=questionScore(l);
      return `<section class="quiz"><div class="quizHead"><div><div class="eyebrow">Practice · 练习</div><h3>${l.review?"Checkpoint":"Check your understanding"}</h3><p>Choose one answer for every question. Your answer is kept on this device.</p></div><div class="scorePill">${s.correct} correct · ${s.answered}/${s.total} answered</div></div>
        <div class="questions">${l.questions.map(renderQuestion).join("")}</div></section>`;
    }
    function renderFinish(l){
      const s=questionScore(l),eligible=s.total>0&&s.answered===s.total,done=state.completed.includes(l.id);
      return `<section class="finishBox${done?" done":""}"><div><div class="eyebrow">${done?"Completed · 已完成":"Lesson progress · 本课进度"}</div><h3>${done?"Saved to your course progress":eligible?"Ready to complete":`Answer ${s.total-s.answered} more question${s.total-s.answered===1?"":"s"}`}</h3><p>${done?"You can revisit and change answers at any time.":"A lesson counts only after all questions have an answer."}</p></div>
        <button class="finishBtn" data-finish="${l.id}" ${eligible?"":"disabled"}>${done?"Completed ✓":"Mark lesson complete"}</button></section>`;
    }
    function renderCover(){
      return `<section class="hero"><div class="eyebrow">Junior Secondary Mathematics 1A</div><h2>Algebra begins with a relationship.</h2><p>This course rewrites the two scanned textbook chapters into bilingual concept lessons, worked examples, interactive labs and 48 self-check questions.</p>
        <div class="heroStats"><span class="heroStat">2 textbook chapters</span><span class="heroStat">14 assessed units</span><span class="heroStat">48 questions</span><span class="heroStat">3 interactive labs</span></div></section>
        <div class="sectionTitle"><div class="eyebrow">Learning map · 学习路线</div><h2>From symbols to solutions</h2><p>Chapter 3 builds the language of algebra. Chapter 4 uses that language to form and solve linear equations.</p><p class="zhText">第 3 章建立代数语言，第 4 章用这种语言建立并解一元一次方程。</p></div>
        <section class="chapterStrip"><article class="chapterCard"><span>CHAPTER 3 · 3.1–3.3</span><h3>Introduction to Algebra</h3><p>Letters, expressions, formulas, substitution, number patterns and general terms.</p></article>
        <article class="chapterCard"><span>CHAPTER 4 · 4.1–4.3</span><h3>Linear Equations</h3><p>Balance method, transposition, brackets, fractions and real-life modelling.</p></article></section>
        <section class="example"><div class="exampleGrid"><div><div class="eyebrow">How to use this site</div><h3>Learn → practise → explain</h3><p>Read the rule, follow the worked steps, then answer every question. Turn on Chinese translation whenever you need support.</p></div><ol class="steps"><li data-step="1">Choose a lesson from the left menu.</li><li data-step="2">Use the interactive labs to test patterns.</li><li data-step="3">Complete all questions to save progress.</li></ol></div></section>`;

    }
    function renderSummary(){
      const all=lessons.flatMap(l=>l.questions||[]);let answered=0,correct=0;all.forEach(q=>{if(state.answers[q.id]!==undefined){answered++;if(state.answers[q.id]===q.answer)correct++}});
      const completed=assessable.filter(l=>state.completed.includes(l.id)).length;
      const chapterRows=[
        ["3.1","Algebraic language & simplification",["language","notation"]],
        ["3.2","Formulas & substitution",["formula"]],
        ["3.3","Sequences & general term",["sequence","common-sequences","general-term"]],
        ["4.1","Basic solving techniques",["balance","transposition"]],
        ["4.2","More equation techniques",["combine","brackets","denominators"]],
        ["4.3","Applications",["applications"]]
      ];
      return `<section class="hero"><div class="eyebrow">Course summary · 学习总结</div><h2>Your algebra learning record.</h2><p>Use this dashboard to revisit unfinished lessons and explain each rule in your own words.</p></section>
        <section class="summaryGrid"><div class="stat"><strong>${completed}/${assessable.length}</strong><span>units complete · 已完成</span></div><div class="stat"><strong>${answered}/${all.length}</strong><span>questions answered · 已作答</span></div><div class="stat"><strong>${correct}</strong><span>currently correct · 当前答对</span></div><div class="stat"><strong>${answered?Math.round(correct/answered*100):0}%</strong><span>accuracy · 正确率</span></div></section>
        <section class="summaryList">${chapterRows.map(row=>{const ls=row[2].map(findLesson);const total=ls.reduce((n,l)=>n+lessonQuestions(l).length,0);const ans=ls.reduce((n,l)=>n+questionScore(l).answered,0);return `<button class="summaryRow" data-go="${row[2][0]}"><strong>${row[0]}</strong><span>${row[1]}</span><b>${ans}/${total}</b></button>`}).join("")}</section>
        <section class="example"><div class="eyebrow">Core reference · 核心公式</div><h3>Keep these structures visible</h3><table class="formulaTable"><tr><th>Topic</th><th>Structure</th></tr><tr><td>Linear sequence</td><td>Tₙ = dn + c</td></tr><tr><td>Balance principle</td><td>same operation on both sides</td></tr><tr><td>Distribution</td><td>a(b + c) = ab + ac</td></tr><tr><td>Problem solving</td><td>define x → form equation → solve → check</td></tr></table></section>`;
    }
    function render(){
      const l=findLesson(state.active);document.body.classList.toggle("showZh",state.showZh);
      document.getElementById("translateBtn").classList.toggle("on",state.showZh);
      document.getElementById("translateBtn").setAttribute("aria-pressed",String(state.showZh));
      document.getElementById("translateBtn").textContent=state.showZh?"隐藏中文":"中文翻译";
      document.getElementById("topEn").textContent=l.en;document.getElementById("topZh").textContent=l.zh;
      const main=document.getElementById("main");
      if(l.kind==="cover")main.innerHTML=renderCover();
      else if(l.kind==="summary")main.innerHTML=renderSummary();
      else main.innerHTML=`<header class="sectionTitle"><div class="eyebrow">${esc(l.code)} · ${l.group.includes("Chapter 3")?"Introduction to Algebra":"Linear Equations"}</div><h2>${esc(l.en)}</h2><p>${esc(l.intro)}</p><p class="zhText">${esc(l.introZh)}</p></header>${l.concepts?renderConcepts(l):""}${l.example?renderExample(l.example):""}${l.lab?renderLab(l.lab):""}${renderQuiz(l)}${renderFinish(l)}`;
      renderNav();bindLabs();main.focus({preventScroll:true});window.scrollTo({top:0,behavior:"smooth"});
    }
    function bindLabs(){
      const l=findLesson(state.active);
      if(l.lab==="formula"){
        const update=()=>{const type=document.getElementById("formulaChoice").value,a=Number(document.getElementById("valueA").value)||0,b=Number(document.getElementById("valueB").value)||0,c=Number(document.getElementById("valueC").value)||0;
          const la=document.getElementById("labelA"),lb=document.getElementById("labelB"),lc=document.getElementById("labelC"),out=document.getElementById("labResult");
          if(type==="rect"){la.textContent="l";lb.textContent="w";lc.textContent="not used · 本公式不用";out.textContent=`P = 2(${a} + ${b}) = ${2*(a+b)}`}
          if(type==="tri"){la.textContent="b";lb.textContent="h";lc.textContent="not used · 本公式不用";out.textContent=`A = ½ × ${a} × ${b} = ${a*b/2}`}
          if(type==="volume"){la.textContent="l";lb.textContent="w";lc.textContent="h";out.textContent=`V = ${a} × ${b} × ${c} = ${a*b*c}`}};
        ["formulaChoice","valueA","valueB","valueC"].forEach(id=>document.getElementById(id).addEventListener("input",update));update();
      }
      if(l.lab==="sequence"){
        const update=()=>{const a=Number(document.getElementById("seqFirst").value)||0,d=Number(document.getElementById("seqDiff").value)||0,n=Math.max(1,Math.min(100,Number(document.getElementById("seqN").value)||1));
          const list=Array.from({length:6},(_,i)=>a+i*d).join(", ");const c=a-d;document.getElementById("labResult").textContent=`${list} · Tₙ = ${d}n ${c<0?"−":"+"} ${Math.abs(c)} · T${n} = ${a+(n-1)*d}`};
        ["seqFirst","seqDiff","seqN"].forEach(id=>document.getElementById(id).addEventListener("input",update));update();
      }
      if(l.lab==="equation"){
        const update=()=>{const a=Number(document.getElementById("eqA").value)||0,b=Number(document.getElementById("eqB").value)||0,c=Number(document.getElementById("eqC").value)||0,d=Number(document.getElementById("eqD").value)||0;
          const A=a-c,D=d-b,out=document.getElementById("labResult"),fmt=n=>n<0?`− ${Math.abs(n)}`:`+ ${n}`;
          out.textContent=A===0?(D===0?"Both sides are identical: infinitely many solutions.":"The x-terms cancel: no solution."):`${a}x ${fmt(b)} = ${c}x ${fmt(d)} → ${A}x = ${D} → x = ${Number((D/A).toFixed(3))}`};
        ["eqA","eqB","eqC","eqD"].forEach(id=>document.getElementById(id).addEventListener("input",update));update();
      }
    }
    document.addEventListener("click",e=>{
      const go=e.target.closest("[data-go]");if(go){state.active=go.dataset.go;save();closeMenu();render();return}
      const opt=e.target.closest("[data-qid]");if(opt){const l=findLesson(state.active),item=(l.questions||[]).find(q=>q.id===opt.dataset.qid);if(item){state.answers[item.id]=item.options[Number(opt.dataset.opt)];save();render()}return}
      const finish=e.target.closest("[data-finish]");if(finish&&!finish.disabled){const id=finish.dataset.finish;if(!state.completed.includes(id))state.completed.push(id);save();render()}
    });
    function closeMenu(){document.getElementById("sidebar").classList.remove("open");document.getElementById("overlay").classList.remove("open")}
    document.getElementById("menuBtn").addEventListener("click",()=>{document.getElementById("sidebar").classList.add("open");document.getElementById("overlay").classList.add("open")});
    document.getElementById("overlay").addEventListener("click",closeMenu);
    document.getElementById("translateBtn").addEventListener("click",()=>{state.showZh=!state.showZh;save();render()});
    document.getElementById("resetBtn").addEventListener("click",()=>{if(confirm("Reset all saved answers and progress?\\n确定重置所有答案和进度吗？")){localStorage.removeItem(STORAGE_KEY);state={answers:{},completed:[],active:"start",showZh:false};render()}});
    render();
  })();
  </script>
<button class="fumi-ai-fab" id="fumi-ai-fab" type="button" aria-controls="fumi-ai-panel" aria-expanded="false">问 FUMI AI</button>

<script data-fumi-mode="learning">
(() => {
  const mode = document.currentScript?.dataset.fumiMode === "practice" ? "practice" : "learning";
  const STORE = `fumi-ai-algebra-${mode}-v1`;
  const $ = selector => document.querySelector(selector);
  const clean = (value, max = 1800) => String(value ?? "").trim().slice(0, max);
  const safeLoad = () => {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORE) || "{}");
      return { chats: parsed.chats || {}, endpoint: parsed.endpoint || "" };
    } catch { return { chats: {}, endpoint: "" }; }
  };
  const aiState = safeLoad();
  let busy = false;

  let lastContextKey = "";
  let lastCanReveal = false;
  const save = () => localStorage.setItem(STORE, JSON.stringify(aiState));
  const hash = value => {
    let out = 2166136261;
    for (const char of value) out = Math.imul(out ^ char.charCodeAt(0), 16777619);
    return (out >>> 0).toString(36);
  };
  const text = (selector, root = document) => clean(root.querySelector(selector)?.textContent, 1000);
  const optionText = node => clean(node?.textContent?.replace(/^\s*[1-4]\s*/, ""), 500);

  function learningSnapshot() {
    const titleEn = text("#topEn") || "Course overview";
    const titleZh = text("#topZh") || "课程概览";
    const questions = [...document.querySelectorAll("#main .q")];
    const answered = questions.filter(q => q.querySelector(".option.correct")).length;
    const canReveal = questions.length > 0 && answered === questions.length;
    const questionContext = questions.map(q => {
      const base = { promptEn: text("h4", q), promptZh: text(".zhText", q) };
      if (!canReveal) return base;
      const correct = q.querySelector(".option.correct");
      const wrong = q.querySelector(".option.wrong");
      return { ...base, studentAnswer: optionText(wrong || correct), correctAnswer: optionText(correct), result: wrong ? "incorrect" : "correct" };
    });
    const concepts = [...document.querySelectorAll("#main .concepts .card")].map(card => ({
      title: text("h3", card), explanation: text("p:not(.zhText)", card), chinese: text(".zhText", card)
    })).slice(0, 4);
    const example = document.querySelector("#main .example");
    const progress = text("#progressText");
    const score = text("#main .scorePill");
    const kind = questions.length ? "lesson" : titleEn.toLowerCase().includes("summary") ? "summary" : "overview";
    return {
      key: `learning:${hash(titleEn)}`,
      mode: kind,
      canReveal: questions.length ? canReveal : true,
      contextLabel: `${titleEn} · ${titleZh}`,
      lesson: {
        titleEn, titleZh, concepts,
        workedExample: example ? clean(example.textContent, 1800) : "",
        questions: questionContext,
        lessonProgress: score || "not assessed on this page"
      },
      learningSnapshot: { courseProgress: progress || "0 / 14", currentLessonQuestions: questions.length, answered }
    };
  }

  function practiceSnapshot() {
    const card = $("#stage .questionCard");
    const completion = $("#stage .completion");
    if (!card) {
      return {
        key: completion ? "practice:summary" : "practice:general",
        mode: completion ? "summary" : "general",
        canReveal: true,
        contextLabel: text("#queueTitle") || "Practice Bank",
        learningSnapshot: { progress: text("#overallLabel"), correct: text("#correctPill"), wrong: text("#wrongPill"), streak: text("#streakPill"), summary: clean(completion?.textContent, 1600) }
      };
    }
    const promptEn = text(".prompt", card);
    const promptZh = text(".translation", card);
    const inExam = text("#queueTitle") === "限时测验";
    const feedback = card.querySelector(".feedback.show");
    const canReveal = !inExam && Boolean(feedback);
    const question = {
      section: text(".tag.section", card), level: text(".tag.level", card), textbookPage: text(".tag.page", card), promptEn, promptZh
    };
    if (canReveal) {
      const correct = card.querySelector(".option.correct");
      const wrong = card.querySelector(".option.wrong");
      Object.assign(question, {
        studentAnswer: optionText(wrong || correct),
        correctAnswer: optionText(correct),
        result: feedback.classList.contains("correct") ? "correct" : "incorrect",
        explanation: text(".explain", card)
      });
    }
    return {
      key: `${inExam ? "exam" : "practice"}:${hash(promptEn)}`,
      mode: inExam ? "exam" : "practice",
      canReveal,
      contextLabel: `${question.section || "Practice"} · ${question.level || "Question"}`,
      question,
      learningSnapshot: { progress: text("#overallLabel"), correct: text("#correctPill"), wrong: text("#wrongPill"), streak: text("#streakPill") }
    };
  }

  const currentContext = () => mode === "practice" ? practiceSnapshot() : learningSnapshot();
  const endpoint = () => location.protocol === "file:" ? clean(aiState.endpoint, 500) : `${location.origin}/.netlify/functions/ai-tutor`;
  function quickPrompts(ctx) {
    if (ctx.mode === "summary") return ["分析我的薄弱点", "先复习哪一节", "制定40分钟计划", "总结学习进展"];
    if (!ctx.canReveal) return ["只提示第一步", "用中英双语解释题意", "检查我的思路", "我可能混淆了什么"];
    return ["完整讲解这道题", "为什么我错了", "换一种方法", "给我一道相似题"];
  }
  function setStatus(label, kind = "") {
    $("#fumi-ai-status-copy").textContent = label;
    $("#fumi-ai-dot").className = `fumi-ai-dot ${kind}`;
  }
  function renderPanel() {
    const ctx = currentContext();
    lastContextKey = ctx.key;

    lastCanReveal = ctx.canReveal;
    const messages = aiState.chats[ctx.key] || [];
    $("#fumi-ai-context").innerHTML = `<b>${escapeHtml(ctx.contextLabel)}</b><br>${ctx.canReveal ? "已完成，可讨论答案与完整解析" : ctx.mode === "exam" ? "测验保护模式：只给思考提示，不核对或公布答案" : "提交前模式：只提示思考步骤，不公布选项、数值或最终答案"}`;
    $("#fumi-ai-messages").innerHTML = messages.length ? messages.map(item => `<div class="fumi-ai-msg ${item.role === "user" ? "student" : "assistant"}">${escapeHtml(item.content)}</div>`).join("") : `<div class="fumi-ai-msg system">我是随页出现的双语代数助教。告诉我你卡在哪一步；未提交时，我会一次只给一个提示，并留一个问题让你继续思考。</div>`;
    if (busy) $("#fumi-ai-messages").insertAdjacentHTML("beforeend", '<div class="fumi-ai-msg assistant fumi-ai-thinking"><i></i><i></i><i></i></div>');
    $("#fumi-ai-quick").innerHTML = quickPrompts(ctx).map(label => `<button class="fumi-ai-chip" type="button" data-fumi-prompt="${escapeHtml(label)}">${escapeHtml(label)}</button>`).join("");
    $("#fumi-ai-settings").classList.toggle("hidden", location.protocol !== "file:");
    $("#fumi-ai-endpoint").value = aiState.endpoint;
    setStatus(busy ? "正在组织分步提示…" : endpoint() ? "AI 已配置" : "需要配置 AI 后台", busy ? "busy" : endpoint() ? "ok" : "");
    requestAnimationFrame(() => { const list = $("#fumi-ai-messages"); list.scrollTop = list.scrollHeight; });
  }
  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
  }
  function setOpen(open) {
    $("#fumi-ai-panel").classList.toggle("open", open);
    $("#fumi-ai-panel").setAttribute("aria-hidden", String(!open));
    $("#fumi-ai-fab").setAttribute("aria-expanded", String(open));
    if (open) { renderPanel(); setTimeout(() => $("#fumi-ai-input").focus(), 180); }
  }
  async function requestAi(message, context, history) {
    const url = endpoint();
    if (!url) throw new Error("此 HTML 正以本地文件打开，请先填写已部署的 AI 函数地址。");
    let parsed;
    try { parsed = new URL(url); } catch { throw new Error("AI 函数地址格式不正确。"); }
    if (!["http:", "https:"].includes(parsed.protocol)) throw new Error("AI 函数地址必须以 http:// 或 https:// 开头。");
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 30000);
    try {
      const response = await fetch(url, {
        method: "POST", headers: { "Content-Type": "application/json" }, signal: controller.signal,
        body: JSON.stringify({ message, context, history: history.slice(-8), purpose: "tutor" })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `AI 服务暂时不可用（${response.status}）`);
      if (!data.reply) throw new Error("AI 返回内容不完整，请稍后重试。");
      return data;
    } catch (error) {
      if (error.name === "AbortError") throw new Error("AI 响应超过 30 秒，请稍后再试。");
      throw error;
    } finally { clearTimeout(timeout); }
  }
  async function send(message) {
    const value = clean(message, 600);
    if (!value || busy) return;
    const ctx = currentContext();
    const history = [...(aiState.chats[ctx.key] || [])];
    aiState.chats[ctx.key] = [...history, { role: "user", content: value }].slice(-20);
    save(); busy = true; $("#fumi-ai-input").value = ""; $("#fumi-ai-send").disabled = true; renderPanel();
    try {
      const result = await requestAi(value, ctx, history);
      const tail = result.nextAction ? `\n\n下一步：${result.nextAction}` : "";
      aiState.chats[ctx.key] = [...aiState.chats[ctx.key], { role: "assistant", content: `${result.reply}${tail}` }].slice(-20);
    } catch (error) {
      aiState.chats[ctx.key] = [...aiState.chats[ctx.key], { role: "assistant", content: `连接失败：${error.message}` }].slice(-20);
    } finally { save(); busy = false; $("#fumi-ai-send").disabled = false; renderPanel(); }
  }

  $("#fumi-ai-fab").addEventListener("click", () => setOpen(!$("#fumi-ai-panel").classList.contains("open")));
  $("#fumi-ai-close").addEventListener("click", () => setOpen(false));
  $("#fumi-ai-form").addEventListener("submit", event => { event.preventDefault(); send($("#fumi-ai-input").value); });
  $("#fumi-ai-input").addEventListener("keydown", event => { if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); $("#fumi-ai-form").requestSubmit(); } });
  $("#fumi-ai-quick").addEventListener("click", event => { const button = event.target.closest("[data-fumi-prompt]"); if (button) send(button.dataset.fumiPrompt); });
  $("#fumi-ai-endpoint-save").addEventListener("click", () => {
    const value = clean($("#fumi-ai-endpoint").value, 500);
    if (value && !/^https?:\/\//i.test(value)) { alert("地址需以 https:// 或 http:// 开头"); return; }
    aiState.endpoint = value; save(); renderPanel();
  });
  document.addEventListener("keydown", event => { if (event.key === "Escape") setOpen(false); });
  const observer = new MutationObserver(() => {
    if (!$("#fumi-ai-panel").classList.contains("open")) return;
    const key = currentContext().key;
    if (key !== lastContextKey || currentContext().canReveal !== lastCanReveal) renderPanel();
    else {
      const ctx = currentContext();
      $("#fumi-ai-context").innerHTML = `<b>${escapeHtml(ctx.contextLabel)}</b><br>${ctx.canReveal ? "已完成，可讨论答案与完整解析" : ctx.mode === "exam" ? "测验保护模式：只给思考提示，不核对或公布答案" : "提交前模式：只提示思考步骤，不公布选项、数值或最终答案"}`;
    }
  });
  observer.observe($(mode === "practice" ? "#stage" : "#main"), { childList: true, subtree: true });
})();

</script>
<script src="assets/course-bridge.js"></script>
</body>
