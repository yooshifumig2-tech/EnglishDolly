    .miniFill{height:100%;background:var(--teal);border-radius:99px}.examClock{font-variant-numeric:tabular-nums}.mobileScrim{display:none}
    .shortcut{margin-top:14px;color:var(--soft);font-size:10.5px;text-align:center}

      background:rgba(0,0,0,.34);z-index:35;opacity:0;pointer-events:none;transition:.2s}.mobileScrim.show{opacity:1;pointer-events:auto}

    #printArea{display:none}
  .fumi-ai-fab{position:fixed;right:24px;bottom:24px;z-index:120;border:0;border-radius:999px;padding:13px 18px;background:linear-gradient(135deg,#e2792a,#bf4f24);color:#fff;font:800 14px/1 Inter,"Noto Sans SC",sans-serif;box-shadow:0 14px 35px rgba(137,60,27,.28);cursor:pointer;display:flex;align-items:center;gap:8px}

.fumi-ai-panel.open{opacity:1;transform:none;pointer-events:auto}.fumi-ai-head{display:flex;align-items:center;gap:11px;padding:15px 16px;border-bottom:1px solid var(--line,#e7dfd2);background:linear-gradient(135deg,color-mix(in srgb,#e2792a 12%,var(--surface,var(--paper,#fff))),var(--surface,var(--paper,#fff)))}
.fumi-ai-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:#e2792a;color:#fff;font-weight:900}.fumi-ai-title{min-width:0;flex:1}.fumi-ai-title b{display:block;font-size:14px}.fumi-ai-status{display:flex;align-items:center;gap:6px;color:var(--muted,#776f64);font-size:10.5px}.fumi-ai-dot{width:7px;height:7px;border-radius:50%;background:#b7afa3}.fumi-ai-dot.ok{background:#3e9b6d}.fumi-ai-dot.busy{background:#e2792a;animation:fumiPulse 1s infinite}.fumi-ai-close{border:0;background:var(--surface2,#f3ede3);color:inherit;width:32px;height:32px;border-radius:10px;cursor:pointer}
.fumi-ai-context{padding:10px 15px;border-bottom:1px solid var(--line,#e7dfd2);background:var(--surface2,#f7f1e8);color:var(--muted,#776f64);font-size:11.5px}.fumi-ai-context b{color:var(--text,#29251f)}

.fumi-ai-quick{display:flex;gap:7px;overflow:auto;padding:0 14px 10px}.fumi-ai-chip{flex:none;border:1px solid var(--line,#ded7cb);border-radius:999px;background:var(--surface,var(--paper,#fff));color:var(--muted,#776f64);padding:7px 10px;font:750 11px/1 inherit;cursor:pointer}.fumi-ai-chip:hover{border-color:#e2792a;color:#c45c23}.fumi-ai-compose{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 14px;border-top:1px solid var(--line,#e7dfd2)}.fumi-ai-input{width:100%;min-height:44px;max-height:110px;resize:none;border:1px solid var(--line,#ded7cb);border-radius:12px;background:var(--surface,var(--paper,#fff));color:inherit;padding:10px 12px;font:inherit}.fumi-ai-send{align-self:end;border:0;border-radius:12px;background:#2569b0;color:#fff;padding:11px 14px;font-weight:800;cursor:pointer}.fumi-ai-send:disabled{opacity:.5;cursor:wait}

<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="chapterPill">BOOK 1A · CHAPTERS 3–4</div><h1>Practice Bank</h1><p>Algebra & Linear Equations · 代数与方程</p></div>
      <div class="overall"><div class="progressLabel"><span>Overall Progress</span><strong id="overallLabel">0/48</strong></div>
        <div class="progressTrack"><div class="progressFill" id="overallBar"></div></div></div>
      <div class="sideScroll">
        <div class="filterGroup"><p class="filterTitle">Section 分组</p><div class="chips" id="sectionChips"></div></div>
        <div class="filterGroup"><p class="filterTitle">Level 难度</p><div class="chips" id="levelChips"></div></div>

          <button class="toolBtn" id="randomBtn"><span class="icon">🔀</span>随机练习</button>
          <button class="toolBtn" id="examBtn"><span class="icon">⏱️</span>限时组卷</button>
          <button class="toolBtn" id="statsBtn"><span class="icon">📊</span>学习统计</button>
          <button class="toolBtn" id="exportBtn"><span class="icon">📤</span>导出进度</button>
        </div></div>
      </div>
      <div class="sideFoot">
        <button class="wideBtn" id="wrongBtn"><span>📕 错题本 · Wrong Bank</span><span class="badge" id="wrongCount">0</span></button>
        <button class="wideBtn" id="favBtn"><span>⭐ 收藏题 · Favorites</span><span class="badge" id="favCount">0</span></button>
        <button class="wideBtn" id="printBtn"><span>🖨️ 打印错题</span><span>›</span></button>

      </div>
    </aside>
    <div class="mobileScrim" id="scrim"></div>
    <main class="main">
      <header class="topbar">
        <div class="topActions"><button class="iconBtn menuBtn" id="menuBtn" aria-label="Open practice menu">☰</button>
          <div class="topTitle"><h2 id="queueTitle">全部题目</h2><p id="queueSubtitle">Chapters 3–4 · 48 questions</p></div></div>
        <div class="topActions"><span class="statPill good" id="correctPill">✓ 0</span><span class="statPill bad" id="wrongPill">✕ 0</span>

  </div>
  <div class="overlay" id="examModal"><div class="modal"><div class="modalHead"><h3>自动组卷 · Exam Builder</h3>

  <div id="printArea"></div>
  <script>
  (() => {
    const STORE="jsm1a-algebra-practice-v1";
    const SECTIONS=[
      {id:"all",zh:"全部",en:"All questions"},
      {id:"3.1",zh:"代数语言",en:"Algebraic language"},
      {id:"3.2",zh:"公式代入",en:"Formulas & substitution"},

    const sec=id=>SECTIONS.find(s=>s.id===id)||SECTIONS[0],shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
    function getQueue(){
      if(state.exam)return state.exam.ids.map(id=>Q.find(q=>q.id===id)).filter(Boolean);
      if(state.mode==="wrong")return Q.filter(q=>state.wrong[q.id]);
      if(state.mode==="favorites")return Q.filter(q=>state.favorites[q.id]);
      if(state.mode==="random")return (state.randomIds||[]).map(id=>Q.find(q=>q.id===id)).filter(Boolean);
      return Q.filter(q=>(state.section==="all"||q.section===state.section)&&(state.level==="all"||String(q.level)===state.level));
    }
    function renderFilters(){
      $("#sectionChips").innerHTML=SECTIONS.map(s=>`<button class="chip ${state.section===s.id&&state.mode==="normal"?"active":""}" data-section="${s.id}">${s.zh}${s.id==="all"?"":" · "+s.id}</button>`).join("");

      const titles={wrong:"错题本",favorites:"收藏题",random:"随机练习",examResult:"测验结果"};
      $("#queueTitle").textContent=state.exam?"限时测验":titles[state.mode]||sec(state.section).zh;

        <div class="shortcut">键盘：1–4 选择答案 · Enter 下一题 · T 翻译</div>
      </article>`;
      bindCard();if(state.exam)startTimer();

    function bindCard(){
      const q=queue[state.index];
      document.querySelectorAll("[data-option]").forEach(btn=>btn.onclick=()=>answer(q,q.options[Number(btn.dataset.option)]));
      $("#translateBtn").onclick=()=>{state.showZh=!state.showZh;save();render()};
      const hint=$("#hintBtn");if(hint)hint.onclick=()=>$("#hint").classList.toggle("show");
    }
    function answer(q,value){
      if(state.exam){state.exam.answers[q.id]=value;save();render();return}
      if(state.answers[q.id])return;const correct=value===q.answer,prev=state.attempts[q.id];
      state.answers[q.id]={value,correct,at:Date.now()};state.attempts[q.id]={attempts:(prev?.attempts||0)+1,firstCorrect:prev?.firstCorrect??correct,lastCorrect:correct};
      if(correct){state.currentStreak++;state.bestStreak=Math.max(state.bestStreak,state.currentStreak)}else{state.wrong[q.id]=true;state.currentStreak=0}
      save();render();
    }
    function nav(delta){
      if(state.exam&&state.index===queue.length-1&&delta>0)return finishExam();
      state.index=Math.max(0,state.index+delta);save();render();
    }
    function renderCompletion(examResult){
      let total,done,correct,title,icon;
      if(examResult&&state.lastExam){({total,done,correct}=state.lastExam);title="测验完成";icon="⏱️"}
      else{total=queue.length;done=queue.filter(q=>state.answers[q.id]).length;correct=queue.filter(q=>state.answers[q.id]?.correct).length;title="本组练习完成";icon="✓"}
      $("#stage").innerHTML=`<section class="completion"><div class="big">${icon}</div><h3>${title}</h3><p>检查错误原因后，可以重练本组题目或进入错题本。</p>
        <div class="scoreGrid"><div class="scoreBox"><b>${done}/${total}</b><span>已作答</span></div><div class="scoreBox"><b>${correct}</b><span>答对</span></div>
        <div class="scoreBox"><b>${done?Math.round(correct/done*100):0}%</b><span>正确率</span></div></div>
        <div class="completionActions"><button class="secondaryBtn" data-retry>重新练习</button><button class="secondaryBtn" data-mode="wrong">练习错题</button>
        <button class="primaryBtn" data-back>返回全部</button></div></section>`;
    }
    function setMode(mode){
      state.mode=mode;state.exam=null;state.index=0;state.randomIds=null;
      if(mode==="wrong")Q.filter(q=>state.wrong[q.id]).forEach(q=>delete state.answers[q.id]);
      save();closeSide();render();
    }
    function backAll(){state.mode="normal";state.exam=null;state.lastExam=null;state.section="all";state.level="all";state.index=0;state.randomIds=null;save();closeSide();render()}
    function open(id){$("#"+id).classList.add("show")}function close(id){$("#"+id).classList.remove("show")}
    function closeSide(){$("#sidebar").classList.remove("open");$("#scrim").classList.remove("show")}
    function startExam(){
      const size=Number($("#examSize").value),minutes=Number($("#examMinutes").value),section=$("#examSection").value;
      const pool=Q.filter(q=>section==="all"||q.section===section);
      const ids=shuffle(pool).slice(0,Math.min(size,pool.length)).map(q=>q.id);
      state.exam={ids,answers:{},end:Date.now()+minutes*60000,minutes};state.mode="exam";state.index=0;state.lastExam=null;
      close("examModal");save();render();
    }
    function startTimer(){clearInterval(timer);tick();timer=setInterval(tick,1000)}
    function tick(){if(!state.exam)return clearInterval(timer);if(Date.now()>=state.exam.end)return finishExam();const el=$("#examClock");if(!el)return;
      const s=Math.max(0,Math.ceil((state.exam.end-Date.now())/1000));el.textContent=`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}
    function finishExam(){if(!state.exam)return;const answers=state.exam.answers,total=state.exam.ids.length,done=Object.keys(answers).length;
      const correct=state.exam.ids.filter(id=>answers[id]===Q.find(q=>q.id===id)?.answer).length;
      state.exam.ids.forEach(id=>{const q=Q.find(z=>z.id===id),value=answers[id];if(!q||value===undefined)return;const ok=value===q.answer,prev=state.attempts[id];
        state.attempts[id]={attempts:(prev?.attempts||0)+1,firstCorrect:prev?.firstCorrect??ok,lastCorrect:ok};state.answers[id]={value,correct:ok,at:Date.now()};if(!ok)state.wrong[id]=true});
      state.lastExam={total,done,correct,ids:[...state.exam.ids]};state.exam=null;state.mode="examResult";state.index=0;clearInterval(timer);save();render();
    }
    function renderStats(){
      const attempted=Object.keys(state.attempts).length,first=Object.values(state.attempts).filter(a=>a.firstCorrect).length;
      const last=Object.values(state.attempts).filter(a=>a.lastCorrect).length;
      const rows=SECTIONS.filter(s=>s.id!=="all").map(s=>{const qs=Q.filter(q=>q.section===s.id),done=qs.filter(q=>state.attempts[q.id]).length;
        const good=qs.filter(q=>state.attempts[q.id]?.lastCorrect).length;return `<div class="sectionRow"><b>${s.id}</b><div class="miniTrack"><div class="miniFill" style="width:${qs.length?done/qs.length*100:0}%"></div></div><span>${good}/${done}/${qs.length}</span></div>`}).join("");
      $("#statsContent").innerHTML=`<div class="statsGrid"><div class="statsBox"><b>${attempted}</b><span>已练习</span></div><div class="statsBox"><b>${attempted?Math.round(first/attempted*100):0}%</b><span>首次正确率</span></div>
        <div class="statsBox"><b>${last}</b><span>当前答对</span></div><div class="statsBox"><b>${state.bestStreak}</b><span>最佳连对</span></div></div>
        <p class="filterTitle">答对 / 已做 / 总题数</p><div class="sectionStats">${rows}</div>`;open("statsModal");
    }
    function exportProgress(){const blob=new Blob([JSON.stringify({app:"Algebra Practice Bank",version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:"application/json"});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="algebra-practice-progress.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
    function printWrong(){const list=Q.filter(q=>state.wrong[q.id]);$("#printArea").innerHTML=`<h1>错题本 · Algebra & Linear Equations</h1><p>${list.length} questions · ${new Date().toLocaleDateString()}</p>${list.map((q,i)=>`<div class="printQ"><b>${i+1}. [${q.section}] ${esc(q.prompt)}</b><p>${esc(q.zh)}</p><p>Answer: ${esc(q.answer)}</p><p>${esc(q.zhWhy)}</p></div>`).join("")}`;window.print()}
    document.addEventListener("click",e=>{
      const s=e.target.closest("[data-section]");if(s){state.section=s.dataset.section;state.mode="normal";state.index=0;save();closeSide();render();return}
      const l=e.target.closest("[data-level]");if(l){state.level=l.dataset.level;state.index=0;save();render();return}
      const n=e.target.closest("[data-nav]");if(n&&!n.disabled){nav(Number(n.dataset.nav));return}
      const f=e.target.closest("[data-favorite]");if(f){state.favorites[f.dataset.favorite]=!state.favorites[f.dataset.favorite];if(!state.favorites[f.dataset.favorite])delete state.favorites[f.dataset.favorite];save();render();return}
      if(e.target.closest("[data-back]"))backAll();const m=e.target.closest("[data-mode]");if(m)setMode(m.dataset.mode);
      if(e.target.closest("[data-retry]")){const ids=state.lastExam?.ids||queue.map(q=>q.id);ids.forEach(id=>delete state.answers[id]);state.index=0;state.mode="normal";state.lastExam=null;save();render()}
      const c=e.target.closest("[data-close]");if(c)close(c.dataset.close);
    });
    document.addEventListener("keydown",e=>{if(document.querySelector(".overlay.show"))return;if(["1","2","3","4"].includes(e.key)&&queue[state.index])answer(queue[state.index],queue[state.index].options[Number(e.key)-1]);
      if(e.key==="Enter")nav(1);if(e.key.toLowerCase()==="t"){state.showZh=!state.showZh;save();render()}});
    $("#randomBtn").onclick=()=>{const pool=Q.filter(q=>(state.section==="all"||q.section===state.section)&&(state.level==="all"||String(q.level)===state.level));
      state.randomIds=shuffle(pool).map(q=>q.id);state.randomIds.forEach(id=>delete state.answers[id]);state.mode="random";state.index=0;save();closeSide();render()};
    $("#examBtn").onclick=()=>open("examModal");$("#startExam").onclick=startExam;$("#statsBtn").onclick=renderStats;$("#exportBtn").onclick=exportProgress;
    $("#wrongBtn").onclick=()=>setMode("wrong");$("#favBtn").onclick=()=>setMode("favorites");$("#printBtn").onclick=printWrong;
    $("#backAll").onclick=backAll;$("#themeBtn").onclick=()=>{state.theme=state.theme==="light"?"dark":"light";save();render()};
    $("#menuBtn").onclick=()=>{$("#sidebar").classList.add("open");$("#scrim").classList.add("show")};$("#scrim").onclick=closeSide;
    $("#resetBtn").onclick=()=>{if(confirm("确定清除全部答题、错题和收藏记录吗？\\nReset all practice progress?")){localStorage.removeItem(STORE);state=empty();render()}};
    render();if(state.exam)startTimer();
  })();
  </script>
<button class="fumi-ai-fab" id="fumi-ai-fab" type="button" aria-controls="fumi-ai-panel" aria-expanded="false">问 FUMI AI</button>
<aside class="fumi-ai-panel" id="fumi-ai-panel" aria-label="FUMI AI 代数助教" aria-hidden="true">
  <header class="fumi-ai-head">
    <div class="fumi-ai-mark">F</div>
    <div class="fumi-ai-title"><b>FUMI AI 代数助教</b><span class="fumi-ai-status"><i class="fumi-ai-dot" id="fumi-ai-dot"></i><span id="fumi-ai-status-copy">准备就绪</span></span></div>
    <button class="fumi-ai-close" id="fumi-ai-close" type="button" aria-label="关闭 FUMI AI">✕</button>
  </header>
  <div class="fumi-ai-context" id="fumi-ai-context"></div>
  <div class="fumi-ai-messages" id="fumi-ai-messages" role="log" aria-live="polite"></div>
  <div class="fumi-ai-quick" id="fumi-ai-quick"></div>
  <form class="fumi-ai-compose" id="fumi-ai-form">
    <textarea class="fumi-ai-input" id="fumi-ai-input" maxlength="600" rows="2" placeholder="说说你卡在哪一步…" aria-label="向 FUMI AI 提问"></textarea>
    <button class="fumi-ai-send" id="fumi-ai-send" type="submit">发送</button>
  </form>
  <div class="fumi-ai-settings hidden" id="fumi-ai-settings">
    <label for="fumi-ai-endpoint">本地 HTML 使用已部署的函数地址（不是 API Key）</label>
    <div class="fumi-ai-settings-row"><input class="fumi-ai-endpoint" id="fumi-ai-endpoint" inputmode="url" placeholder="https://example.netlify.app/.netlify/functions/ai-tutor"><button class="fumi-ai-save" id="fumi-ai-endpoint-save" type="button">保存</button></div>
    <div class="fumi-ai-note">对话只保存在此浏览器；发送时仅上传当前学习上下文。</div>
  </div>
</aside>


<script data-fumi-mode="practice">
(() => {
  const mode = document.currentScript?.dataset.fumiMode === "practice" ? "practice" : "learning";
  const STORE = `fumi-ai-algebra-${mode}-v1`;
  const $ = selector => document.querySelector(selector);
  const clean = (value, max = 1800) => String(value ?? "").trim().slice(0, max);
  const safeLoad = () => {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORE) || "{}");
      return { chats: parsed.chats || {}, endpoint: parsed.endpoint || "" };
    } catch { return { chats: {}, endpoint: "" }; }
  };
  const aiState = safeLoad();
  let busy = false;
  let lastContextKey = "";
  let lastCanReveal = false;
  const save = () => localStorage.setItem(STORE, JSON.stringify(aiState));
  const hash = value => {
    let out = 2166136261;
    for (const char of value) out = Math.imul(out ^ char.charCodeAt(0), 16777619);
    return (out >>> 0).toString(36);
  };
  const text = (selector, root = document) => clean(root.querySelector(selector)?.textContent, 1000);
  const optionText = node => clean(node?.textContent?.replace(/^\s*[1-4]\s*/, ""), 500);

  function learningSnapshot() {
    const titleEn = text("#topEn") || "Course overview";
    const titleZh = text("#topZh") || "课程概览";
    const questions = [...document.querySelectorAll("#main .q")];
    const answered = questions.filter(q => q.querySelector(".option.correct")).length;
    const canReveal = questions.length > 0 && answered === questions.length;
    const questionContext = questions.map(q => {
      const base = { promptEn: text("h4", q), promptZh: text(".zhText", q) };
      if (!canReveal) return base;
      const correct = q.querySelector(".option.correct");
      const wrong = q.querySelector(".option.wrong");
      return { ...base, studentAnswer: optionText(wrong || correct), correctAnswer: optionText(correct), result: wrong ? "incorrect" : "correct" };
    });
    const concepts = [...document.querySelectorAll("#main .concepts .card")].map(card => ({
      title: text("h3", card), explanation: text("p:not(.zhText)", card), chinese: text(".zhText", card)
    })).slice(0, 4);
    const example = document.querySelector("#main .example");
    const progress = text("#progressText");
    const score = text("#main .scorePill");
    const kind = questions.length ? "lesson" : titleEn.toLowerCase().includes("summary") ? "summary" : "overview";
    return {
      key: `learning:${hash(titleEn)}`,
      mode: kind,
      canReveal: questions.length ? canReveal : true,
      contextLabel: `${titleEn} · ${titleZh}`,
      lesson: {
        titleEn, titleZh, concepts,
        workedExample: example ? clean(example.textContent, 1800) : "",
        questions: questionContext,
        lessonProgress: score || "not assessed on this page"
      },
      learningSnapshot: { courseProgress: progress || "0 / 14", currentLessonQuestions: questions.length, answered }
    };
  }

  function practiceSnapshot() {
    const card = $("#stage .questionCard");
    const completion = $("#stage .completion");
    if (!card) {
      return {
        key: completion ? "practice:summary" : "practice:general",
        mode: completion ? "summary" : "general",
        canReveal: true,
        contextLabel: text("#queueTitle") || "Practice Bank",
        learningSnapshot: { progress: text("#overallLabel"), correct: text("#correctPill"), wrong: text("#wrongPill"), streak: text("#streakPill"), summary: clean(completion?.textContent, 1600) }
      };
    }
    const promptEn = text(".prompt", card);
    const promptZh = text(".translation", card);
    const inExam = text("#queueTitle") === "限时测验";
    const feedback = card.querySelector(".feedback.show");
    const canReveal = !inExam && Boolean(feedback);
    const question = {
      section: text(".tag.section", card), level: text(".tag.level", card), textbookPage: text(".tag.page", card), promptEn, promptZh
    };
    if (canReveal) {
      const correct = card.querySelector(".option.correct");
      const wrong = card.querySelector(".option.wrong");
      Object.assign(question, {
        studentAnswer: optionText(wrong || correct),
        correctAnswer: optionText(correct),
        result: feedback.classList.contains("correct") ? "correct" : "incorrect",
        explanation: text(".explain", card)
      });
    }
    return {
      key: `${inExam ? "exam" : "practice"}:${hash(promptEn)}`,
      mode: inExam ? "exam" : "practice",
      canReveal,
      contextLabel: `${question.section || "Practice"} · ${question.level || "Question"}`,
      question,
      learningSnapshot: { progress: text("#overallLabel"), correct: text("#correctPill"), wrong: text("#wrongPill"), streak: text("#streakPill") }
    };
  }

  const currentContext = () => mode === "practice" ? practiceSnapshot() : learningSnapshot();
  const endpoint = () => location.protocol === "file:" ? clean(aiState.endpoint, 500) : `${location.origin}/.netlify/functions/ai-tutor`;
  function quickPrompts(ctx) {
    if (ctx.mode === "summary") return ["分析我的薄弱点", "先复习哪一节", "制定40分钟计划", "总结学习进展"];
    if (!ctx.canReveal) return ["只提示第一步", "用中英双语解释题意", "检查我的思路", "我可能混淆了什么"];
    return ["完整讲解这道题", "为什么我错了", "换一种方法", "给我一道相似题"];
  }
  function setStatus(label, kind = "") {
    $("#fumi-ai-status-copy").textContent = label;
    $("#fumi-ai-dot").className = `fumi-ai-dot ${kind}`;
  }
  function renderPanel() {
    const ctx = currentContext();
    lastContextKey = ctx.key;
    lastCanReveal = ctx.canReveal;
    const messages = aiState.chats[ctx.key] || [];
    $("#fumi-ai-context").innerHTML = `<b>${escapeHtml(ctx.contextLabel)}</b><br>${ctx.canReveal ? "已完成，可讨论答案与完整解析" : ctx.mode === "exam" ? "测验保护模式：只给思考提示，不核对或公布答案" : "提交前模式：只提示思考步骤，不公布选项、数值或最终答案"}`;
    $("#fumi-ai-messages").innerHTML = messages.length ? messages.map(item => `<div class="fumi-ai-msg ${item.role === "user" ? "student" : "assistant"}">${escapeHtml(item.content)}</div>`).join("") : `<div class="fumi-ai-msg system">我是随页出现的双语代数助教。告诉我你卡在哪一步；未提交时，我会一次只给一个提示，并留一个问题让你继续思考。</div>`;
    if (busy) $("#fumi-ai-messages").insertAdjacentHTML("beforeend", '<div class="fumi-ai-msg assistant fumi-ai-thinking"><i></i><i></i><i></i></div>');
    $("#fumi-ai-quick").innerHTML = quickPrompts(ctx).map(label => `<button class="fumi-ai-chip" type="button" data-fumi-prompt="${escapeHtml(label)}">${escapeHtml(label)}</button>`).join("");
    $("#fumi-ai-settings").classList.toggle("hidden", location.protocol !== "file:");
    $("#fumi-ai-endpoint").value = aiState.endpoint;
    setStatus(busy ? "正在组织分步提示…" : endpoint() ? "AI 已配置" : "需要配置 AI 后台", busy ? "busy" : endpoint() ? "ok" : "");
    requestAnimationFrame(() => { const list = $("#fumi-ai-messages"); list.scrollTop = list.scrollHeight; });
  }
  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
  }
  function setOpen(open) {
    $("#fumi-ai-panel").classList.toggle("open", open);
    $("#fumi-ai-panel").setAttribute("aria-hidden", String(!open));
    $("#fumi-ai-fab").setAttribute("aria-expanded", String(open));
    if (open) { renderPanel(); setTimeout(() => $("#fumi-ai-input").focus(), 180); }
  }
  async function requestAi(message, context, history) {
    const url = endpoint();
    if (!url) throw new Error("此 HTML 正以本地文件打开，请先填写已部署的 AI 函数地址。");
    let parsed;
    try { parsed = new URL(url); } catch { throw new Error("AI 函数地址格式不正确。"); }
    if (!["http:", "https:"].includes(parsed.protocol)) throw new Error("AI 函数地址必须以 http:// 或 https:// 开头。");
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 30000);
    try {
      const response = await fetch(url, {
        method: "POST", headers: { "Content-Type": "application/json" }, signal: controller.signal,
        body: JSON.stringify({ message, context, history: history.slice(-8), purpose: "tutor" })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `AI 服务暂时不可用（${response.status}）`);
      if (!data.reply) throw new Error("AI 返回内容不完整，请稍后重试。");
      return data;
    } catch (error) {
      if (error.name === "AbortError") throw new Error("AI 响应超过 30 秒，请稍后再试。");
      throw error;
    } finally { clearTimeout(timeout); }
  }
  async function send(message) {
    const value = clean(message, 600);
    if (!value || busy) return;
    const ctx = currentContext();
    const history = [...(aiState.chats[ctx.key] || [])];
    aiState.chats[ctx.key] = [...history, { role: "user", content: value }].slice(-20);
    save(); busy = true; $("#fumi-ai-input").value = ""; $("#fumi-ai-send").disabled = true; renderPanel();
    try {
      const result = await requestAi(value, ctx, history);
      const tail = result.nextAction ? `\n\n下一步：${result.nextAction}` : "";
      aiState.chats[ctx.key] = [...aiState.chats[ctx.key], { role: "assistant", content: `${result.reply}${tail}` }].slice(-20);
    } catch (error) {
      aiState.chats[ctx.key] = [...aiState.chats[ctx.key], { role: "assistant", content: `连接失败：${error.message}` }].slice(-20);
    } finally { save(); busy = false; $("#fumi-ai-send").disabled = false; renderPanel(); }
  }

  $("#fumi-ai-fab").addEventListener("click", () => setOpen(!$("#fumi-ai-panel").classList.contains("open")));
  $("#fumi-ai-close").addEventListener("click", () => setOpen(false));
  $("#fumi-ai-form").addEventListener("submit", event => { event.preventDefault(); send($("#fumi-ai-input").value); });
  $("#fumi-ai-input").addEventListener("keydown", event => { if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); $("#fumi-ai-form").requestSubmit(); } });
  $("#fumi-ai-quick").addEventListener("click", event => { const button = event.target.closest("[data-fumi-prompt]"); if (button) send(button.dataset.fumiPrompt); });
  $("#fumi-ai-endpoint-save").addEventListener("click", () => {
    const value = clean($("#fumi-ai-endpoint").value, 500);
    if (value && !/^https?:\/\//i.test(value)) { alert("地址需以 https:// 或 http:// 开头"); return; }
    aiState.endpoint = value; save(); renderPanel();
  });
  document.addEventListener("keydown", event => { if (event.key === "Escape") setOpen(false); });
  const observer = new MutationObserver(() => {
    if (!$("#fumi-ai-panel").classList.contains("open")) return;
    const key = currentContext().key;
    if (key !== lastContextKey || currentContext().canReveal !== lastCanReveal) renderPanel();
    else {
      const ctx = currentContext();
      $("#fumi-ai-context").innerHTML = `<b>${escapeHtml(ctx.contextLabel)}</b><br>${ctx.canReveal ? "已完成，可讨论答案与完整解析" : ctx.mode === "exam" ? "测验保护模式：只给思考提示，不核对或公布答案" : "提交前模式：只提示思考步骤，不公布选项、数值或最终答案"}`;
    }
  });
  observer.observe($(mode === "practice" ? "#stage" : "#main"), { childList: true, subtree: true });
})();

</script>
