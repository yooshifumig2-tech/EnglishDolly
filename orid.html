<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOLLY · ORID Reflection</title><link rel="stylesheet" href="assets/hub.css"></head>
<body><div data-hub-header></div><main class="hub-shell hub-main"><div class="workspace-head"><div><p class="eyebrow">AUTO-FILLED REFLECTION</p><h1>ORID 学习复盘</h1><p>系统先依据你的阶段记录生成可编辑草稿；请补上自己的感受和证据。中英文都可以填写。</p></div><div class="workspace-actions"><button class="button secondary" id="autofill">重新自动填写</button><button class="button secondary" id="export">导出 JSON</button><button class="button" onclick="print()">打印 / PDF</button></div></div><form class="orid-grid" id="orid"></form><div class="orid-tips"><b>ORID 提示：</b>O 写可观察事实，R 写真实感受，I 写你的理解，D 写下一次可执行的决定。自动草稿不会代替你的思考。</div></main><script src="assets/hub.js"></script><script>
addEventListener('DOMContentLoaded',()=>{DollyHub.mountCommon('orid');const form=document.querySelector('#orid');function defaults(){const data=DollyHub.load(),p=DollyHub.progress(),next=DollyHub.nextStage(),done=Object.values(DollyHub.UNITS).filter(u=>DollyHub.stageDone(u.id,'learning')&&DollyHub.stageDone(u.id,'practice')).map(u=>u.id).join('、')||'暂无';return {o:`Objective｜事实\n我已完成 ${p.done}/8 个学习阶段，已进入 ${p.started}/8 个阶段。\n已完成学习闭环的单元：${done}。\n已标记掌握的双语术语：${Object.keys(data.terms||{}).filter(k=>data.terms[k]).length} 个。`,r:`Reflective｜感受\n我在学习中感到：\n（例如：数轴的方向让我更有把握；分数运算仍需要慢一点。）`,i:`Interpretive｜理解\n“阶段完成”只说明我完成或确认了学习流程，并不等于正确率。\n我现在能用自己的话解释的一个 English term / 中文术语是：\n`,d:`Decisional｜决定\n${next?`下一步：完成 ${DollyHub.unitName(next.unit)} 的 ${next.kind==='learning'?'学习':'练习'}阶段。`:'下一步：复习错题或挑选一个章节做更高难度变式题。'}\n我会在下一次学习前先：`}}function render(reset=false){const saved=DollyHub.load().reflections?.orid||{},d=defaults(),items=[['o','O · Objective','客观事实 / What happened'],['r','R · Reflective','感受 / How did I react'],['i','I · Interpretive','理解 / What does it mean'],['d','D · Decisional','决定 / What will I do next']];form.innerHTML=items.map(([id,title,sub])=>`<section class="orid-card ${id}"><h2>${title} <small>${sub}</small></h2><p>${id==='o'?'由学习记录生成，可补充具体页面或题目。':'自动草稿仅作起点，请改成自己的表述。'}</p><textarea name="${id}">${DollyHub.escape(reset?d[id]:(saved[id]||d[id]))}</textarea></section>`).join('')}function persist(){const x=Object.fromEntries(new FormData(form));const state=DollyHub.load();state.reflections={...(state.reflections||{}),orid:{...x,updatedAt:new Date().toISOString()}};localStorage.setItem('dolly-book1a-hub-v1',JSON.stringify(state))}form.addEventListener('input',persist);document.querySelector('#autofill').onclick=()=>{if(confirm('用当前学习记录重新生成 ORID 草稿？现有内容将被替换。')){render(true);persist()}};document.querySelector('#export').onclick=()=>{persist();DollyHub.download('dolly-book1a-orid.json',{exportedAt:new Date().toISOString(),orid:DollyHub.load().reflections.orid,progress:DollyHub.progress()})}}render()});
</script></body></html>
