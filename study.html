<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOLLY · Study Workspace</title><link rel="stylesheet" href="assets/hub.css"><link rel="stylesheet" href="assets/navigation.css"></head>
<body><div data-hub-header></div><main class="hub-shell hub-main" id="app"></main><script src="assets/hub.js"></script><script>
addEventListener('DOMContentLoaded',()=>{DollyHub.mountCommon();const unitId=DollyHub.unitFromUrl(),kind=DollyHub.kindFromUrl(),unit=DollyHub.UNITS[unitId];if(!unit||!['learning','practice'].includes(kind)){location.replace('index.html');return}if(!DollyHub.stageDone(unitId,kind))DollyHub.setStage(unitId,kind,'in_progress',{source:unit.external?'external-workspace':'dolly-local'});let record=DollyHub.stage(unitId,kind);const kindZh=kind==='learning'?'学习':'练习',kindEn=kind==='learning'?'Learning':'Practice';const render=()=>{record=DollyHub.stage(unitId,kind);const done=record.status==='done';const cross=unit.external;document.querySelector('#app').innerHTML=`<div class="workspace-head"><div><p class="eyebrow">${unit.id} · ${kindEn.toUpperCase()}</p><h1>${unit.en}</h1><p>${unit.zh} · ${kindZh}工作台 · 双语术语表与 FUMI AI 保持可用。</p></div><div class="workspace-actions"><a class="button nav-return" href="index.html">← 返回导航页<br><small>Back to Navigation</small></a><button class="button secondary" data-glossary>术语表 Glossary</button><button class="button orange" data-fumi>问 FUMI AI</button></div></div><div class="study-layout"><section class="embed-card"><iframe title="${unit.en} ${kindEn}" src="${unit[kind]}"></iframe></section><aside class="study-side"><article class="section-card"><p class="eyebrow">STAGE STATUS</p><h2>${done?'✓ 本阶段已完成':'进行中 · In progress'}</h2><p>状态更新：${DollyHub.shortDate(record.updatedAt)}</p><button class="button status-button ${done?'done':''}" id="complete">${done?'已同步完成 · Completed':'标记本阶段完成 / Mark complete'}</button></article><article class="section-card"><p class="eyebrow">RECORDING NOTE</p><div class="notice">${cross?'这是外部网站。中枢无法跨域读取其答题记录；它只记录你已进入本阶段。完成后请用上方按钮确认同步。':'这是 DOLLY 本地单元。完成页面内全部学习或答题记录后会自动同步；也可在此确认完成。'}</div></article><article class="section-card"><p class="eyebrow">AFTER THIS</p><h2>学习地图</h2><p>每次同步都会更新课程路线、思维导图和 ORID 自动草稿。</p><a class="button secondary" href="report.html">查看报告</a></article></aside></div>`;document.querySelector('#complete').onclick=()=>{DollyHub.setStage(unitId,kind,done?'in_progress':'done',{source:cross?'learner-confirmed-external':'learner-confirmed-local'});render()}};render()});
</script></body></html>
