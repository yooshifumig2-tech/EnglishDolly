<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOLLY · Learning Map</title><link rel="stylesheet" href="assets/hub.css"></head>
<body><div data-hub-header></div><main class="hub-shell hub-main"><div class="workspace-head"><div><p class="eyebrow">MULTIDIMENSIONAL LEARNING REPORT</p><h1>学习地图 · Learning Map</h1><p>完成阶段后自动点亮思维导图；报告只呈现可验证的学习记录，不把“完成”误写成“正确率”。</p></div><div class="workspace-actions"><button class="button secondary" id="download">导出 JSON</button><button class="button" onclick="print()">打印 / PDF</button></div></div><section class="map-layout"><article class="mindmap" id="mindmap"></article><aside class="section-card pad"><p class="eyebrow">ACTIVITY SNAPSHOT</p><div class="metric-grid" id="metrics"></div><div class="report-note"><b>数据解释：</b>“已完成”代表学生或本地页面确认的阶段状态；外部网站的作答次数、正确率和耗时不会被跨站读取。</div><div class="ai-report"><b>FUMI AI 建议</b><br><span id="ai-advice"></span><br><button class="button secondary" style="margin-top:10px" data-fumi>让 FUMI 帮我复习</button></div></aside></section><article class="section-card pad" style="margin-top:20px"><p class="eyebrow">STAGE-BY-STAGE</p><h2>可继续的学习路径</h2><div class="stage-list" id="stage-list"></div></article></main><script src="assets/hub.js"></script><script>
addEventListener('DOMContentLoaded',()=>{DollyHub.mountCommon('report');const p=DollyHub.progress(),units=Object.values(DollyHub.UNITS);document.querySelector('#metrics').innerHTML=`<div class="metric"><b>${p.done}/8</b><span>完成阶段 · Completed stages</span></div><div class="metric"><b>${p.started}/8</b><span>已进入阶段 · Started stages</span></div><div class="metric"><b>${p.unitsDone}/4</b><span>学习闭环 · Units complete</span></div><div class="metric"><b>${Object.keys(DollyHub.load().terms||{}).filter(k=>DollyHub.load().terms[k]).length}</b><span>已标记术语 · Known terms</span></div>`;document.querySelector('#mindmap').innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="50" y1="50" x2="18" y2="25" stroke="#bed7ee" stroke-width=".45"/><line x1="50" y1="50" x2="82" y2="25" stroke="#bed7ee" stroke-width=".45"/><line x1="50" y1="50" x2="18" y2="75" stroke="#bed7ee" stroke-width=".45"/><line x1="50" y1="50" x2="82" y2="75" stroke="#bed7ee" stroke-width=".45"/></svg><div class="mind-center"><b>BOOK 1A</b><span>Learn → Practice → Reflect</span></div>${units.map((u,i)=>{const done=DollyHub.stageDone(u.id,'learning')&&DollyHub.stageDone(u.id,'practice');return `<a class="mind-node m${['0','1','2','34'][i]} ${done?'done':''}" href="${DollyHub.target(u.id,DollyHub.stageDone(u.id,'learning')?'practice':'learning')}"><b>${u.id} ${done?'✓':''}</b><span>${u.zh}</span></a>`}).join('')}`;document.querySelector('#stage-list').innerHTML=units.flatMap(u=>['learning','practice'].map(kind=>{const s=DollyHub.stage(u.id,kind),done=s.status==='done';return `<a class="stage-row" href="${DollyHub.target(u.id,kind)}"><span class="stage-dot ${done?'done':''}">${done?'✓':kind==='learning'?'学':'练'}</span><span><b>${u.id} · ${kind==='learning'?'学习 Learn':'练习 Practice'}</b><span>${u.zh} · ${DollyHub.shortDate(s.updatedAt)}</span></span><span class="stage-state ${done?'done':''}">${done?'完成':'继续 →'}</span></a>`})).join('');const next=DollyHub.nextStage();document.querySelector('#ai-advice').textContent=next?`下一步先完成 ${DollyHub.unitName(next.unit)} 的 ${next.kind==='learning'?'学习':'练习'}；遇到术语先打开 Glossary，再让 FUMI 提供一步提示。`:'所有阶段已完成：打开 ORID，把学习证据、感受、理解与下一步目标整理出来。';document.querySelector('#download').onclick=()=>DollyHub.download('dolly-book1a-learning-report.json',{generatedAt:new Date().toISOString(),progress:p,records:DollyHub.load().units,knownTerms:DollyHub.load().terms||{}})});
</script></body></html>
